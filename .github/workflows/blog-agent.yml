name: TraceThem Blog Agent

on:
  schedule:
    - cron: '30 2 * * *'   # 8:00 AM IST (UTC+5:30 = UTC 02:30)
    - cron: '30 14 * * *'  # 8:00 PM IST (UTC+5:30 = UTC 14:30)
  workflow_dispatch:        # Manual trigger from GitHub UI

jobs:
  publish-post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/tracethem_hostinger
          chmod 600 ~/.ssh/tracethem_hostinger
          ssh-keyscan -p 65002 89.117.188.213 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run blog agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SSH_KEY_PATH: /home/runner/.ssh/tracethem_hostinger
        run: node scripts/blog-agent.cjs
